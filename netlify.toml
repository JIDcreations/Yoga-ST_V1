# The website lives in site/. No build step: the HTML is pre-generated by site/_build.py.
[build]
  publish = "site"
  command = ""

# Old WordPress post URLs -> practical info (permanent, keeps search rankings)
[[redirects]]
  from = "/stilte/*"
  to = "/onze-lessen/#praktisch"
  status = 301
  force = true

[[redirects]]
  from = "/de-lessen/*"
  to = "/onze-lessen/#praktisch"
  status = 301
  force = true

[[redirects]]
  from = "/yogafeest/*"
  to = "/onze-lessen/#praktisch"
  status = 301
  force = true

# Don't serve the build script
[[redirects]]
  from = "/_build.py"
  to = "/"
  status = 404
  force = true
